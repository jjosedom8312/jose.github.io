<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Jose J Dominguez | Mechanical Engineering Portfolio</title>

<style>
:root{
  --bg-dark:#0b132b;
  --bg-mid:#1c2541;
  --bg-light:#0b1220;
  --card-dark:rgba(0,0,0,.45);
  --accent:#7dd3fc;
  --text:#ffffff;
  --muted:rgba(255,255,255,.85);
  --radius:18px;
  --max:1100px;
}

*{box-sizing:border-box}
body{
  margin:0;
  font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;
  background:#000;
  color:var(--text);
}

/* ================= HERO ================= */
.hero{
  min-height:100vh;
  display:flex;
  align-items:center;
  background:url("assets/hero-stars.jpg") center/cover no-repeat;
  position:relative;
}
.hero::before{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(to bottom, rgba(0,0,0,.4), rgba(0,0,0,.75));
}
.hero .container{
  position:relative;
  z-index:2;
  max-width:var(--max);
  margin:auto;
  padding:40px;
  display:grid;
  grid-template-columns:1.4fr .6fr;
  gap:40px;
}
@media(max-width:900px){
  .hero .container{
    grid-template-columns:1fr;
    text-align:center;
  }
}

/* TITLE — +10% */
.hero h1{
  font-size:66px; /* was ~60 */
  margin:0 0 14px;
  line-height:1.05;
}

/* DESCRIPTION — +10% */
.hero p{
  font-size:22px; /* was ~20 */
  line-height:1.6;
  color:var(--muted);
  max-width:60ch;
}

/* TAGS / PILLS — +10% */
.pills span{
  display:inline-block;
  padding:10px 16px;
  margin:8px 8px 0 0;
  border-radius:999px;
  border:1px solid rgba(255,255,255,.25);
  background:rgba(0,0,0,.35);
  font-size:15px; /* was ~13–14 */
}

/* BUTTONS */
.buttons{
  margin-top:18px;
}
.buttons a{
  display:inline-block;
  margin:10px 10px 0 0;
  padding:14px 20px;
  border-radius:14px;
  border:1px solid rgba(255,255,255,.3);
  color:#fff;
  text-decoration:none;
  font-weight:700;
  font-size:16px;
}
.buttons a.primary{
  background:linear-gradient(135deg, rgba(125,211,252,.4), rgba(167,139,250,.3));
}

/* PHOTO CARD */
.photo-card{
  background:var(--card-dark);
  border-radius:22px;
  padding:22px;
  text-align:center;
}
.photo{
  width:260px;
  height:320px;
  border-radius:14px;
  overflow:hidden;
  border:6px solid #fff;
  margin:auto;
}
.photo img{
  width:100%;
  height:100%;
  object-fit:cover;
}

/* ICONS */
.icons{
  margin-top:14px;
  display:flex;
  justify-content:center;
  gap:14px;
}
.icons a{
  width:44px;
  height:44px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:12px;
  background:rgba(255,255,255,.12);
}
.icons img{
  width:22px;
  height:22px;
  filter:invert(1);
}
</style>
</head>

<body>

<section class="hero">
  <div class="container">

    <!-- LEFT -->
    <div>
      <h1>Jose J Dominguez</h1>
      <p>
        First-generation Mechanical Engineering student at Colorado School of Mines
        focused on aerospace systems, simulation, and embedded engineering.
      </p>

      <div class="pills">
        <span>CAD / Design</span>
        <span>Simulation</span>
        <span>Robotics</span>
        <span>Aerospace</span>
      </div>

      <div class="buttons">
        <a class="primary" href="assets/resume.pdf" target="_blank">Resume (PDF)</a>
        <a class="primary" href="assets/cv.pdf" target="_blank">CV (PDF)</a>
      </div>
    </div>

    <!-- RIGHT -->
    <div class="photo-card">
      <div class="photo">
        <img src="assets/profile.jpg" alt="Jose Dominguez">
      </div>

      <div class="icons">
        <a href="https://github.com/josedom8312" target="_blank">
          <img src="assets/github.svg" alt="GitHub">
        </a>
        <a href="mailto:your.email@domain.com">
          <img src="assets/email.svg" alt="Email">
        </a>
        <a href="https://linkedin.com/in/YOUR-LINK" target="_blank">
          <img src="assets/linkedin.svg" alt="LinkedIn">
        </a>
      </div>
    </div>

  </div>
</section>

</body>
</html>
